<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Imports Brasil Estoque</title>
<meta name="theme-color" content="#0f4c5c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#eef1f3;--surface:#fff;--ink:#1c2830;--muted:#5d6b75;--line:#d5dce1;--accent:#0f4c5c;--accent-ink:#fff;--ok:#2f7d4f;--warn:#a86a00;--bad:#b23a48;--warn-bg:#fdf0d5;--bad-bg:#f9dfe2;--ok-bg:#dff1e6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12191e;--surface:#1b252c;--ink:#e6ecef;--muted:#93a2ac;--line:#2f3d46;--accent:#5fb3c6;--accent-ink:#0b1a20;--ok:#6fcf97;--warn:#f0b254;--bad:#f08a96;--warn-bg:#3a2d12;--bad-bg:#3d1f25;--ok-bg:#183024}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12191e;--surface:#1b252c;--ink:#e6ecef;--muted:#93a2ac;--line:#2f3d46;--accent:#5fb3c6;--accent-ink:#0b1a20;--ok:#6fcf97;--warn:#f0b254;--bad:#f08a96;--warn-bg:#3a2d12;--bad-bg:#3d1f25;--ok-bg:#183024}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:920px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px;font-weight:600}
h2{font-size:16px;margin:0 0 10px;font-weight:600}
nav{display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid var(--line);margin-bottom:16px}
nav button{background:none;border:0;padding:10px 14px;font:inherit;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
nav button.on{color:var(--accent);border-bottom-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);flex:1 1 140px}
input,select,textarea{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{font:inherit;font-weight:500;padding:9px 14px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:none;color:var(--accent)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn.danger{border-color:var(--bad);color:var(--bad);background:none}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:13px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:500}
.t-ok{background:var(--ok-bg);color:var(--ok)}.t-warn{background:var(--warn-bg);color:var(--warn)}.t-bad{background:var(--bad-bg);color:var(--bad)}
.empty{color:var(--muted);padding:18px 4px;text-align:center}
.order{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;background:var(--surface)}
.order header{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.order ul{margin:6px 0 10px;padding-left:18px}
.draft{margin:10px 0;padding:0;list-style:none}
.draft li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}
#msg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;display:none;max-width:90%;z-index:5}
.report-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0}
.report-stat{border:1px solid var(--line);border-radius:7px;padding:10px}
.report-stat strong{display:block;color:var(--accent);font-size:20px;margin-top:2px}
.report-stat span{color:var(--muted);font-size:12px}
.report-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.report-subtitle{color:var(--muted);font-size:13px;margin:0}
@media print{
  @page{size:A4 landscape;margin:14mm}
  body{background:#fff!important;color:#1c2830!important;font-size:11px}
  main{max-width:none;padding:0}
  main>.top,nav,#msg,.report-no-print{display:none!important}
  #view{display:block!important}
  .report-page{display:block!important}
  .card{background:#fff!important;border:0!important;border-radius:0!important;padding:0!important;margin:0 0 12px!important;break-inside:avoid}
  .report-summary{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}
  .report-stat{border:1px solid #d5dce1!important;padding:8px}
  .report-stat span{color:#5d6b75!important}
  .report-stat strong{color:#0f4c5c!important;font-size:17px}
  .scroll{overflow:visible!important}
  table{font-size:10px}
  th,td{white-space:normal!important;padding:6px 5px}
  th{background:#eef1f3!important;color:#42515b!important}
  .tag{background:#f2f4f5!important;color:#26353d!important}
  tr{break-inside:avoid}
}

.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.top h1{margin:4px 0}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.login{max-width:380px;margin:8vh auto 0}
.login h1{text-align:center}
.login .row{flex-direction:column;align-items:stretch}
.login .btn{width:100%}
.err{color:var(--bad);font-size:13px;min-height:18px;margin:8px 0 0}
.link{background:none;border:0;color:var(--accent);font:inherit;font-size:13px;cursor:pointer;padding:8px 0 0;text-decoration:underline}
#setup code{background:var(--bg);padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<main>
<div id="setup" style="display:none"><div class="card"><h2>Configuração pendente</h2>
<p>Falta conectar o sistema ao banco de dados. Abra o arquivo <code>firebase-config.js</code>, cole os dados do seu projeto Firebase e publique de novo. O passo a passo está no <code>LEIA-ME.md</code>.</p></div></div>

<div id="login" class="login" style="display:none"><h1>Imports Brasil Estoque</h1>
<form class="card" onsubmit="doLogin(event)"><h2>Entrar</h2><div class="row">
<label>E-mail<input id="l-email" type="email" autocomplete="username" inputmode="email"></label>
<label>Senha<input id="l-pass" type="password" autocomplete="current-password"></label>
<button class="btn" id="l-btn" type="submit">Entrar</button></div>
<p class="err" id="l-err" role="alert"></p>
<button type="button" class="link" onclick="resetPass()">Esqueci a senha</button></form></div>

<div id="app" style="display:none">
<div class="top"><h1>Imports Brasil Estoque</h1><div class="who"><span id="who"></span><button class="btn ghost sm" onclick="logout()">Sair</button></div></div>
<nav id="nav"></nav>
<div id="view"><div class="empty">Carregando…</div></div>
</div>
</main>
<div id="msg" role="status"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
var S={products:[],orders:[],moves:[],seq:1},tab='estoque',draft=[],q='';
var db=null,auth=null,user=null,unsubs=[],ready={p:false,o:false,m:false,c:false},busy=false;

/* ---------- utilidades ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function prod(id){return S.products.find(function(p){return p.id===id})}
function fmt(d){return new Date(d).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}
function pad(n){return String(n).padStart(4,'0')}
function clean(o){return JSON.parse(JSON.stringify(o))}
function safeId(value){return typeof value==='string'&&/^[a-z0-9_-]+$/i.test(value)}
function val(id){return document.getElementById(id).value.trim()}
var tm;function toast(t){var m=document.getElementById('msg');m.textContent=t;m.style.display='block';clearTimeout(tm);tm=setTimeout(function(){m.style.display='none'},3200)}
function fail(e){
  console.error(e);
  var c=e&&e.code,m=e&&e.message;
  if(c==='unavailable'||/offline/i.test(m||''))m='Sem conexão com a internet. Tente novamente quando estiver online.';
  else if(c==='permission-denied')m='Sem permissão. Entre novamente no sistema.';
  toast(m||'Ocorreu um erro. Tente novamente.');
}
function status(p){return p.qty<=0?'<span class="tag t-bad">Zerado</span>':p.qty<=p.min?'<span class="tag t-warn">Baixo</span>':'<span class="tag t-ok">Em estoque</span>'}
function opts(){return S.products.map(function(p){return '<option value="'+p.id+'">'+esc(p.sku)+' – '+esc(p.name)+' ('+p.qty+')</option>'}).join('')}
function newMove(pid,p,type,qty,ref){return {date:Date.now(),type:type,pid:pid,name:p.name,sku:p.sku,qty:qty,ref:ref||'',by:user?user.email:''}}
function go(t){tab=t;render()}

/* ---------- backup ---------- */
function validInventoryData(data){
  return !!data&&typeof data==='object'&&!Array.isArray(data)&&
    Number.isInteger(data.seq)&&data.seq>=1&&
    Array.isArray(data.products)&&data.products.every(function(p){
      return p&&typeof p==='object'&&safeId(p.id)&&typeof p.sku==='string'&&typeof p.name==='string'&&
        Number.isInteger(p.qty)&&p.qty>=0&&Number.isInteger(p.min)&&p.min>=0&&
        (p.sizes===undefined||(Array.isArray(p.sizes)&&p.sizes.every(function(size){return typeof size==='string'})))&&
        (p.notes===undefined||typeof p.notes==='string');
    })&&
    Array.isArray(data.orders)&&data.orders.every(function(o){
      return o&&typeof o==='object'&&safeId(o.id)&&safeId(o.num)&&typeof o.client==='string'&&
        typeof o.date==='number'&&Number.isFinite(o.date)&&
        (o.status==='Pendente'||o.status==='Atendido'||o.status==='Cancelado')&&
        Array.isArray(o.items)&&o.items.every(function(i){
          return i&&typeof i==='object'&&safeId(i.pid)&&Number.isInteger(i.qty)&&i.qty>0;
        });
    })&&
    Array.isArray(data.moves)&&data.moves.every(function(m){
      return m&&typeof m==='object'&&safeId(m.id)&&typeof m.date==='number'&&Number.isFinite(m.date)&&
        (m.type==='Entrada'||m.type==='Saída')&&safeId(m.pid)&&typeof m.name==='string'&&
        typeof m.sku==='string'&&Number.isInteger(m.qty)&&m.qty>0&&typeof m.ref==='string';
    });
}
function readBackupFile(file){
  if(typeof file.text==='function')return file.text();
  return new Promise(function(resolve,reject){
    var reader=new FileReader();
    reader.onload=function(){resolve(String(reader.result||''))};
    reader.onerror=function(){reject(new Error('Não foi possível ler o arquivo.'))};
    reader.readAsText(file);
  });
}
async function downloadBackup(){
  try{
    toast('Gerando backup…');
    var all=await db.collection('moves').get();
    var data={products:S.products.map(clean),orders:S.orders.map(clean),seq:S.seq,
      moves:all.docs.map(function(d){return Object.assign({id:d.id},d.data())}).sort(function(a,b){return b.date-a.date})};
    var content=JSON.stringify({format:'imports-brasil-estoque-backup',version:1,exportedAt:new Date().toISOString(),data:data},null,2);
    var blob=new Blob([content],{type:'application/json'});
    var url=URL.createObjectURL(blob);
    var link=document.createElement('a');
    link.href=url;
    link.download='imports-brasil-estoque-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(link);link.click();link.remove();
    setTimeout(function(){URL.revokeObjectURL(url)},1000);
    toast('Backup JSON baixado.');
  }catch(e){fail(e)}
}
async function wipe(name){
  for(;;){
    var s=await db.collection(name).limit(400).get();
    if(s.empty)break;
    var b=db.batch();s.docs.forEach(function(d){b.delete(d.ref)});await b.commit();
  }
}
async function writeAll(name,items,fix){
  for(var i=0;i<items.length;i+=400){
    var b=db.batch();
    items.slice(i,i+400).forEach(function(x){
      var data=clean(fix?fix(x):x);delete data.id;
      b.set(db.collection(name).doc(x.id),data);
    });
    await b.commit();
  }
}
async function importBackup(event){
  var input=event.target,file=input.files&&input.files[0];
  if(!file)return;
  try{
    var parsed=JSON.parse(await readBackupFile(file));
    if(!parsed||parsed.format!=='imports-brasil-estoque-backup'||parsed.version!==1||!validInventoryData(parsed.data)){
      throw new Error('Esse arquivo não é um backup compatível do estoque.');
    }
    var d=parsed.data;
    var message='O arquivo contém '+d.products.length+' produto(s), '+d.orders.length+' pedido(s) e '+d.moves.length+
      ' movimentação(ões). A restauração APAGA TODOS OS DADOS ATUAIS DA EMPRESA (visíveis para todos os usuários) e os substitui por esses.';
    if(!confirm(message+' Deseja continuar?'))return;
    if(busy)return;busy=true;toast('Restaurando… aguarde, não feche a página.');
    await wipe('products');await wipe('orders');await wipe('moves');
    await writeAll('products',d.products,function(p){return {id:p.id,sku:p.sku,name:p.name,qty:p.qty,min:p.min,sizes:p.sizes||[],notes:p.notes||''}});
    await writeAll('orders',d.orders);
    await writeAll('moves',d.moves);
    var maxSku=0;d.products.forEach(function(p){var m=/^IMP-(\d+)$/i.exec(p.sku||'');if(m)maxSku=Math.max(maxSku,Number(m[1]))});
    await db.doc('meta/counters').set({seq:d.seq,sku:maxSku});
    toast('Backup restaurado com sucesso.');
  }catch(error){
    fail(error);
  }finally{
    busy=false;input.value='';
  }
}
function printStockReport(){
  var originalTitle=document.title;
  document.title='Relatorio-Estoque-'+new Date().toISOString().slice(0,10);
  if(window.AndroidPrint&&typeof window.AndroidPrint.printStockReport==='function'){
    window.AndroidPrint.printStockReport();document.title=originalTitle;return;
  }
  var restoreTitle=function(){document.title=originalTitle;window.removeEventListener('afterprint',restoreTitle)};
  window.addEventListener('afterprint',restoreTitle);
  window.print();
}

/* ---------- operações no banco (transações = seguras com vários usuários) ---------- */
async function addProduct(){
  var name=val('p-name'),sizes=val('p-sizes').split(/[,\n;]+/).map(function(s){return s.trim().toUpperCase()}).filter(Boolean),
    notes=val('p-notes'),qty=parseInt(val('p-qty'))||0,min=parseInt(val('p-min'))||0;
  if(!name)return toast('Informe o nome do produto.');
  if(qty<0||min<0)return toast('Quantidades não podem ser negativas.');
  var id=uid(),sku;
  try{
    await db.runTransaction(async function(t){
      var cref=db.doc('meta/counters'),c=await t.get(cref);
      var n=(c.exists&&c.data().sku)||0;
      sku='IMP-'+pad(n+1);
      t.set(cref,{sku:n+1},{merge:true});
      var p={sku:sku,name:name,qty:qty,min:min,sizes:Array.from(new Set(sizes)),notes:notes};
      t.set(db.collection('products').doc(id),p);
      if(qty>0)t.set(db.collection('moves').doc(uid()),newMove(id,p,'Entrada',qty,'Estoque inicial'));
    });
    toast('Produto salvo. Código: '+sku);render();
  }catch(e){fail(e)}
}
async function delProduct(id){
  if(S.orders.some(function(o){return o.status==='Pendente'&&o.items.some(function(i){return i.pid===id})}))return toast('Este produto está em um pedido pendente.');
  if(!confirm('Excluir este produto?'))return;
  try{await db.collection('products').doc(id).delete();toast('Produto excluído.')}catch(e){fail(e)}
}
async function doMove(){
  var type=val('m-type'),pid=val('m-prod'),qty=parseInt(val('m-qty')),ref=val('m-ref');
  if(!pid)return toast('Cadastre um produto primeiro.');
  if(!qty||qty<1)return toast('Informe uma quantidade maior que zero.');
  if(type==='Saída'&&!ref)return toast('Informe o número do pedido para a saída.');
  try{
    await db.runTransaction(async function(t){
      var pr=db.collection('products').doc(pid),d=await t.get(pr);
      if(!d.exists)throw new Error('Produto não encontrado.');
      var p=d.data();
      if(type==='Saída'&&p.qty<qty)throw new Error('Estoque insuficiente: há '+p.qty+' unidades.');
      t.update(pr,{qty:p.qty+(type==='Entrada'?qty:-qty)});
      t.set(db.collection('moves').doc(uid()),newMove(pid,p,type,qty,ref));
    });
    toast(type+' registrada.');render();
  }catch(e){fail(e)}
}
function addDraft(){
  var pid=val('o-prod'),qty=parseInt(val('o-qty'));
  if(!pid||!qty||qty<1)return toast('Escolha o produto e a quantidade.');
  var ex=draft.find(function(i){return i.pid===pid});
  if(ex)ex.qty+=qty;else draft.push({pid:pid,qty:qty});
  render(true);
}
function rmDraft(i){draft.splice(i,1);render(true)}
async function saveOrder(){
  var client=val('o-client');
  if(!client)return toast('Informe o cliente.');
  if(!draft.length)return toast('Adicione ao menos um item.');
  var num;
  try{
    await db.runTransaction(async function(t){
      var cref=db.doc('meta/counters'),c=await t.get(cref);
      var n=(c.exists&&c.data().seq)||S.seq||1;
      num='PED-'+pad(n);
      t.set(cref,{seq:n+1},{merge:true});
      t.set(db.collection('orders').doc(uid()),{num:num,client:client,date:Date.now(),status:'Pendente',items:clean(draft),by:user.email});
    });
    draft=[];window._cl='';toast('Pedido '+num+' criado.');render();
  }catch(e){fail(e)}
}
async function fulfill(id){
  try{
    var msg;
    await db.runTransaction(async function(t){
      var oref=db.collection('orders').doc(id),od=await t.get(oref);
      if(!od.exists)throw new Error('Pedido não encontrado.');
      var o=od.data();
      if(o.status!=='Pendente')throw new Error('Este pedido já foi '+o.status.toLowerCase()+' por outro usuário.');
      var need={};o.items.forEach(function(i){need[i.pid]=(need[i.pid]||0)+i.qty});
      var pids=Object.keys(need),snaps=[];
      for(var k=0;k<pids.length;k++)snaps.push(await t.get(db.collection('products').doc(pids[k])));
      var short=[];
      snaps.forEach(function(s,k){if(!s.exists||s.data().qty<need[pids[k]])short.push(s.exists?s.data().name:'item removido')});
      if(short.length)throw new Error('Estoque insuficiente para: '+short.join(', ')+'.');
      snaps.forEach(function(s,k){
        var p=s.data();
        t.update(s.ref,{qty:p.qty-need[pids[k]]});
        t.set(db.collection('moves').doc(uid()),newMove(pids[k],p,'Saída',need[pids[k]],o.num));
      });
      t.update(oref,{status:'Atendido'});
      msg='Baixa do pedido '+o.num+' concluída.';
    });
    toast(msg);
  }catch(e){fail(e)}
}
async function cancelOrder(id){
  var o=S.orders.find(function(x){return x.id===id});
  if(!o||!confirm('Cancelar o pedido '+o.num+'?'))return;
  try{
    await db.runTransaction(async function(t){
      var ref=db.collection('orders').doc(id),d=await t.get(ref);
      if(!d.exists||d.data().status!=='Pendente')throw new Error('Este pedido não está mais pendente.');
      t.update(ref,{status:'Cancelado'});
    });
    toast('Pedido cancelado.');
  }catch(e){fail(e)}
}
async function delMovement(id){
  if(!S.moves.some(function(m){return m.id===id}))return toast('Esta movimentação já foi removida.');
  if(!confirm('Apagar esta movimentação do histórico? O saldo do estoque e os pedidos não serão alterados.'))return;
  try{await db.collection('moves').doc(id).delete();toast('Registro removido do histórico.')}catch(e){fail(e)}
}

/* ---------- telas ---------- */
function vEstoque(){
  var list=S.products.filter(function(p){var t=(p.sku+' '+p.name+' '+(p.sizes||[]).join(' ')+' '+(p.notes||'')).toLowerCase();return t.indexOf(q.toLowerCase())>-1});
  var rows=list.map(function(p){return '<tr><td>'+esc(p.sku)+'</td><td>'+esc(p.name)+'</td><td>'+esc((p.sizes||[]).join(', ')||'—')+'</td><td>'+esc(p.notes||'—')+'</td><td class="n">'+p.qty+'</td><td class="n">'+p.min+'</td><td>'+status(p)+'</td><td><button class="btn danger sm" onclick="delProduct(\''+p.id+'\')">Excluir</button></td></tr>'}).join('');
  return '<div class="card"><h2>Novo produto</h2><p style="color:var(--muted);font-size:13px;margin:0 0 10px">O código será gerado automaticamente ao salvar.</p><div class="row">'+
  '<label style="flex:2 1 200px">Nome<input id="p-name"></label><label>Tamanhos<input id="p-sizes" placeholder="Ex.: P, M, G, GG"></label>'+
  '<label style="flex:2 1 220px">Observações<textarea id="p-notes" placeholder="Detalhes adicionais do produto"></textarea></label>'+
  '<label>Qtd. inicial<input id="p-qty" type="number" min="0" value="0"></label><label>Estoque mínimo<input id="p-min" type="number" min="0" value="0"></label>'+
  '<button class="btn" onclick="addProduct()">Salvar produto</button></div></div>'+
  '<div class="card"><div class="row" style="margin-bottom:8px"><label style="flex:1 1 240px">Buscar<input id="q" value="'+esc(q)+'" oninput="q=this.value;render(true,\'q\')" placeholder="Código, nome, tamanho ou observação"></label></div>'+
  (list.length?'<div class="scroll"><table><tr><th>Código</th><th>Produto</th><th>Tamanhos</th><th>Observações</th><th class="n">Qtd.</th><th class="n">Mínimo</th><th>Situação</th><th></th></tr>'+rows+'</table></div>':'<div class="empty">'+(S.products.length?'Nenhum produto encontrado.':'Nenhum produto cadastrado. Preencha o formulário acima para começar.')+'</div>')+'</div>'+
  '<div class="card"><h2>Backup e restauração</h2><p style="color:var(--muted);font-size:13px">Baixe um arquivo JSON com todos os dados da empresa. A restauração substitui os dados atuais para todos os usuários. Também serve para importar os dados da versão antiga (que ficava só no aparelho).</p>'+
  '<button class="btn ghost" onclick="downloadBackup()">Baixar backup</button> <button class="btn ghost" onclick="document.getElementById(\'backup-file\').click()">Importar backup</button>'+
  '<input id="backup-file" type="file" accept=".json,application/json" style="display:none" onchange="importBackup(event)"></div>';
}
function vMover(){
  if(!S.products.length)return '<div class="card empty">Cadastre um produto na aba Estoque para registrar movimentações.</div>';
  var open=S.orders.filter(function(o){return o.status==='Pendente'}).map(function(o){return '<option value="'+esc(o.num)+'">'+esc(o.client)+'</option>'}).join('');
  return '<div class="card"><h2>Registrar movimentação</h2><div class="row">'+
  '<label>Tipo<select id="m-type" onchange="refLabel()"><option>Entrada</option><option>Saída</option></select></label>'+
  '<label style="flex:2 1 220px">Produto<select id="m-prod">'+opts()+'</select></label>'+
  '<label>Quantidade<input id="m-qty" type="number" min="1" value="1"></label>'+
  '<label style="flex:1 1 180px"><span id="m-ref-l">Nota / observação</span><input id="m-ref" list="peds"></label>'+
  '<datalist id="peds">'+open+'</datalist>'+
  '<button class="btn" onclick="doMove()">Registrar</button></div>'+
  '<p style="color:var(--muted);font-size:13px;margin:10px 0 0">Na saída, o campo Pedido é obrigatório. Para dar baixa em todos os itens de um pedido de uma vez, use a aba Pedidos.</p></div>';
}
function refLabel(){
  var s=val('m-type')==='Saída';
  document.getElementById('m-ref-l').textContent=s?'Pedido (obrigatório)':'Nota / observação';
  document.getElementById('m-ref').placeholder=s?'Ex.: PED-0001':'';
}
function vPedidos(){
  var dl=draft.map(function(i,k){var p=prod(i.pid);return '<li><span>'+(p?esc(p.name):'Produto removido')+' × '+i.qty+'</span><button class="btn danger sm" onclick="rmDraft('+k+')">Remover</button></li>'}).join('');
  var form=S.products.length?'<div class="card"><h2>Novo pedido</h2><div class="row"><label style="flex:1 1 100%">Cliente<input id="o-client" value="'+esc(window._cl||'')+'" oninput="window._cl=this.value"></label>'+
  '<label style="flex:2 1 220px">Produto<select id="o-prod">'+opts()+'</select></label><label>Quantidade<input id="o-qty" type="number" min="1" value="1"></label>'+
  '<button class="btn ghost" onclick="addDraft()">Adicionar item</button></div>'+
  (draft.length?'<ul class="draft">'+dl+'</ul><button class="btn" onclick="saveOrder()">Criar pedido</button>':'')+'</div>':'<div class="card empty">Cadastre produtos para criar pedidos.</div>';
  var list=S.orders.map(function(o){
    var cls=o.status==='Atendido'?'t-ok':o.status==='Cancelado'?'t-bad':'t-warn';
    var items=o.items.map(function(i){var p=prod(i.pid);return '<li>'+(p?esc(p.name):'Produto removido')+' × '+i.qty+'</li>'}).join('');
    return '<div class="order"><header><strong>'+esc(o.num)+' – '+esc(o.client)+'</strong><span class="tag '+cls+'">'+o.status+'</span></header><small style="color:var(--muted)">'+fmt(o.date)+(o.by?' · '+esc(o.by):'')+'</small><ul>'+items+'</ul>'+
    (o.status==='Pendente'?'<button class="btn sm" onclick="fulfill(\''+o.id+'\')">Dar baixa no estoque</button> <button class="btn danger sm" onclick="cancelOrder(\''+o.id+'\')">Cancelar</button>':'')+'</div>';
  }).join('');
  return form+'<h2>Pedidos</h2>'+(list||'<div class="empty">Nenhum pedido criado.</div>');
}
function vHist(){
  if(!S.moves.length)return '<div class="card empty">Nenhuma movimentação registrada.</div>';
  return (S.moves.length>=500?'<p class="report-subtitle" style="margin:0 0 8px">Mostrando as 500 movimentações mais recentes (o backup contém todas).</p>':'')+
  '<div class="card scroll"><table><tr><th>Data</th><th>Tipo</th><th>Produto</th><th class="n">Qtd.</th><th>Pedido / nota</th><th>Usuário</th><th>Ação</th></tr>'+
  S.moves.map(function(m){return '<tr><td>'+fmt(m.date)+'</td><td><span class="tag '+(m.type==='Entrada'?'t-ok':'t-warn')+'">'+m.type+'</span></td><td>'+esc(m.sku)+' – '+esc(m.name)+'</td><td class="n">'+m.qty+'</td><td>'+esc(m.ref)+'</td><td>'+esc(m.by||'—')+'</td><td><button class="btn danger sm" onclick="delMovement(\''+esc(m.id)+'\')">Apagar</button></td></tr>'}).join('')+'</table></div>';
}
function vRelatorios(){
  var products=S.products.slice().sort(function(a,b){return a.name.localeCompare(b.name,'pt-BR')});
  var total=products.reduce(function(sum,p){return sum+p.qty},0);
  var withStock=products.filter(function(p){return p.qty>0}).length;
  var low=products.filter(function(p){return p.qty>0&&p.qty<=p.min}).length;
  var zero=products.filter(function(p){return p.qty<=0}).length;
  var rows=products.map(function(p){return '<tr><td>'+esc(p.sku)+'</td><td>'+esc(p.name)+'</td><td>'+esc((p.sizes||[]).join(', ')||'—')+'</td><td>'+esc(p.notes||'—')+'</td><td class="n">'+p.qty+'</td><td class="n">'+p.min+'</td><td>'+status(p)+'</td></tr>'}).join('');
  var date=new Date().toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
  return '<div class="report-page" id="stock-report"><div class="card"><div class="report-head"><div><h2>Relatório total de produtos em estoque</h2><p class="report-subtitle">Imports Brasil · Gerado em '+esc(date)+'</p></div>'+
    '<button class="btn report-no-print" onclick="printStockReport()">Gerar PDF</button></div>'+
    '<div class="report-summary"><div class="report-stat"><span>Produtos cadastrados</span><strong>'+products.length+'</strong></div>'+
    '<div class="report-stat"><span>Produtos com saldo</span><strong>'+withStock+'</strong></div>'+
    '<div class="report-stat"><span>Unidades em estoque</span><strong>'+total+'</strong></div>'+
    '<div class="report-stat"><span>Baixo / zerado</span><strong>'+low+' / '+zero+'</strong></div></div>'+
    '<h2>Inventário completo</h2><div class="scroll"><table><thead><tr><th>Código</th><th>Produto</th><th>Tamanhos</th><th>Observações</th><th class="n">Qtd.</th><th class="n">Mín.</th><th>Situação</th></tr></thead><tbody>'+
    (rows||'<tr><td colspan="7" class="empty">Nenhum produto cadastrado.</td></tr>')+'</tbody></table></div></div></div>';
}
function render(keep,focus){
  var tabs=[['estoque','Estoque'],['mover','Movimentar'],['pedidos','Pedidos'],['hist','Histórico'],['relatorios','Relatório']];
  document.getElementById('nav').innerHTML=tabs.map(function(t){return '<button class="'+(tab===t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>'}).join('');
  var v={estoque:vEstoque,mover:vMover,pedidos:vPedidos,hist:vHist,relatorios:vRelatorios}[tab]();
  document.getElementById('view').innerHTML=v;
  if(focus){var el=document.getElementById(focus);if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}}
}
/* Atualização vinda de outro usuário: redesenha sem perder o que está sendo digitado */
function refresh(){
  if(!(ready.p&&ready.o&&ready.m&&ready.c))return;
  var view=document.getElementById('view'),vals={},ae=document.activeElement,fid=null,ss=null,se=null;
  if(ae&&ae.id&&view.contains(ae)){fid=ae.id;try{ss=ae.selectionStart;se=ae.selectionEnd}catch(e){}}
  view.querySelectorAll('input[id],select[id],textarea[id]').forEach(function(el){if(el.type!=='file')vals[el.id]=el.value});
  var sy=window.scrollY;
  render();
  Object.keys(vals).forEach(function(id){
    var el=document.getElementById(id);if(!el)return;
    if(el.tagName==='SELECT'&&!Array.prototype.some.call(el.options,function(o){return o.value===vals[id]}))return;
    el.value=vals[id];
  });
  if(document.getElementById('m-type'))refLabel();
  if(fid){var f=document.getElementById(fid);if(f){f.focus();try{if(ss!==null)f.setSelectionRange(ss,se)}catch(e){}}}
  window.scrollTo(0,sy);
}

/* ---------- login e sincronização ---------- */
function show(id){['setup','login','app'].forEach(function(x){document.getElementById(x).style.display=x===id?'block':'none'})}
function loginError(e){
  var m={'auth/invalid-credential':'E-mail ou senha incorretos.','auth/wrong-password':'E-mail ou senha incorretos.','auth/user-not-found':'E-mail ou senha incorretos.',
    'auth/invalid-email':'E-mail inválido.','auth/too-many-requests':'Muitas tentativas. Aguarde alguns minutos e tente de novo.',
    'auth/network-request-failed':'Sem conexão com a internet.','auth/user-disabled':'Este usuário foi desativado.'};
  return m[e&&e.code]||'Não foi possível entrar. Verifique os dados e tente novamente.';
}
async function doLogin(ev){
  if(ev)ev.preventDefault();
  var em=document.getElementById('l-email').value.trim(),pw=document.getElementById('l-pass').value;
  var err=document.getElementById('l-err'),btn=document.getElementById('l-btn');
  err.textContent='';if(!em||!pw){err.textContent='Informe e-mail e senha.';return}
  btn.disabled=true;
  try{await auth.signInWithEmailAndPassword(em,pw)}catch(e){err.textContent=loginError(e)}
  btn.disabled=false;
}
async function resetPass(){
  var em=document.getElementById('l-email').value.trim(),err=document.getElementById('l-err');
  if(!em){err.textContent='Digite seu e-mail acima e toque em "Esqueci a senha" de novo.';return}
  try{await auth.sendPasswordResetEmail(em);err.textContent='Se este e-mail estiver cadastrado, você receberá um link para criar nova senha.'}
  catch(e){err.textContent=loginError(e)}
}
function logout(){if(confirm('Sair do sistema?'))auth.signOut()}
function stopListening(){unsubs.forEach(function(u){u()});unsubs=[];ready={p:false,o:false,m:false,c:false};S={products:[],orders:[],moves:[],seq:1}}
function startListening(){
  var onErr=function(e){fail(e)};
  unsubs.push(db.collection('products').onSnapshot(function(s){
    S.products=s.docs.map(function(d){return Object.assign({sizes:[],notes:''},d.data(),{id:d.id})}).sort(function(a,b){return a.sku.localeCompare(b.sku)});
    ready.p=true;refresh();
  },onErr));
  unsubs.push(db.collection('orders').onSnapshot(function(s){
    S.orders=s.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})}).sort(function(a,b){return b.date-a.date});
    ready.o=true;refresh();
  },onErr));
  unsubs.push(db.collection('moves').orderBy('date','desc').limit(500).onSnapshot(function(s){
    S.moves=s.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});
    ready.m=true;refresh();
  },onErr));
  unsubs.push(db.doc('meta/counters').onSnapshot(function(d){
    S.seq=(d.exists&&d.data().seq)||1;ready.c=true;refresh();
  },onErr));
}
function boot(){
  var cfg=window.FIREBASE_CONFIG;
  if(!cfg||!cfg.apiKey||/COLE_AQUI/.test(cfg.apiKey)){show('setup');return}
  if(typeof firebase==='undefined'){
    document.getElementById('setup').innerHTML='<div class="card"><h2>Sem conexão</h2><p>Não foi possível carregar o sistema. Verifique a internet e recarregue a página.</p></div>';show('setup');return;
  }
  firebase.initializeApp(cfg);
  auth=firebase.auth();db=firebase.firestore();
  db.enablePersistence({synchronizeTabs:true}).catch(function(){});
  auth.onAuthStateChanged(function(u){
    user=u;stopListening();
    if(u){document.getElementById('who').textContent=u.email;show('app');render();startListening()}
    else{show('login')}
  });
}
boot();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(){})})}

</script>
